# =============================================================================
# Async-Messaging-Architecture - local orchestration
#
#   cp .env.example .env           # then edit the passwords
#   docker compose up --build -d
#
# Dashboard/API ......... http://localhost:3000
# RabbitMQ Management ... http://localhost:15672
# =============================================================================
name: async-messaging

# Shared connection settings (YAML anchors). `${VAR:?msg}` makes Compose refuse
# to start when a required secret is missing, so nothing falls back to a
# hard-coded password.
x-postgres-env: &postgres-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (cp .env.example .env)}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (cp .env.example .env)}
  POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (cp .env.example .env)}

x-rabbitmq-env: &rabbitmq-env
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env (cp .env.example .env)}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env (cp .env.example .env)}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
  RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-reports}
  RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-report.generate}
  RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-reports.jobs}
  RABBITMQ_RETRY_EXCHANGE: ${RABBITMQ_RETRY_EXCHANGE:-reports.retry}
  RABBITMQ_RETRY_QUEUE: ${RABBITMQ_RETRY_QUEUE:-reports.jobs.retry}
  RABBITMQ_DLX: ${RABBITMQ_DLX:-reports.dlx}
  RABBITMQ_DLQ: ${RABBITMQ_DLQ:-reports.jobs.dlq}
  RABBITMQ_DLQ_ROUTING_KEY: ${RABBITMQ_DLQ_ROUTING_KEY:-report.dead}
  RETRY_DELAY_MS: ${RETRY_DELAY_MS:-3000}

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL: durable job status store + transactional outbox
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------------
  # RabbitMQ with the Management UI
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    # A fixed hostname is REQUIRED for durability: RabbitMQ stores its data
    # under a node name derived from the hostname (rabbit@rabbitmq).
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # ---------------------------------------------------------------------------
  # One-shot schema migration (exits 0 when the schema is up to date)
  # ---------------------------------------------------------------------------
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: async-messaging-api:local
    command: ["node", "src/migrate.js"]
    restart: "no"
    environment:
      <<: *postgres-env
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # REST API producer + static dashboard
  # ---------------------------------------------------------------------------
  api:
    image: async-messaging-api:local
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      <<: *postgres-env
      API_INTERNAL_PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ALLOW_FAILURE_SIMULATION: ${ALLOW_FAILURE_SIMULATION:-false}
      RABBITMQ_ROUTING_KEY: ${RABBITMQ_ROUTING_KEY:-report.generate}
      OUTBOX_DEGRADED_AFTER_MS: ${OUTBOX_DEGRADED_AFTER_MS:-30000}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "src/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Transactional outbox relay: PostgreSQL outbox -> RabbitMQ (publisher confirms)
  # ---------------------------------------------------------------------------
  outbox-publisher:
    image: async-messaging-worker:local
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["node", "src/outbox-publisher.js"]
    restart: unless-stopped
    init: true
    environment:
      <<: [*postgres-env, *rabbitmq-env]
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-250}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-50}
      RECONCILE_INTERVAL_MS: ${RECONCILE_INTERVAL_MS:-60000}
      RECONCILE_STALE_MS: ${RECONCILE_STALE_MS:-600000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Background report worker (RabbitMQ consumer)
  # Scale out with: docker compose up -d --scale worker=3
  # ---------------------------------------------------------------------------
  worker:
    image: async-messaging-worker:local
    build:
      context: .
      dockerfile: worker/Dockerfile
    command: ["node", "src/index.js"]
    restart: unless-stopped
    init: true
    # Must exceed WORKER_SHUTDOWN_TIMEOUT_MS so in-flight jobs can finish.
    stop_grace_period: 20s
    environment:
      <<: [*postgres-env, *rabbitmq-env]
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_PREFETCH: ${WORKER_PREFETCH:-1}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      INFRA_RETRY_BACKOFF_MS: ${INFRA_RETRY_BACKOFF_MS:-2000}
      JOB_LEASE_MS: ${JOB_LEASE_MS:-10000}
      PROCESSING_MIN_MS: ${PROCESSING_MIN_MS:-3000}
      PROCESSING_MAX_MS: ${PROCESSING_MAX_MS:-5000}
      WORKER_SHUTDOWN_TIMEOUT_MS: ${WORKER_SHUTDOWN_TIMEOUT_MS:-15000}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  rabbitmq_data:
